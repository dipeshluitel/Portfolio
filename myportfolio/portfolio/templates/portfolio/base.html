{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Dipesh Luitel | Python & Django Developer | BSc. CSIT</title>
    <meta name="title" content="Dipesh Luitel | Python & Django Developer | BSc. CSIT">
    <meta name="description" content="Official portfolio of Dipesh Luitel – Python & Django Developer from Nepal. BSc. CSIT student building scalable web applications, backend systems, and modern web solutions.">
    <meta name="keywords" content="Dipesh Luitel, Python Developer Nepal, Django Developer, Backend Developer, BSc CSIT, Web Developer Portfolio, Django Projects">
    <meta name="author" content="Dipesh Luitel">
    <meta name="robots" content="index, follow">

    <!-- Canonical -->
    <link rel="canonical" href="https://dipeshluitel.com.np/">

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dipeshluitel.com.np/">
    <meta property="og:title" content="Dipesh Luitel | Python & Django Developer">
    <meta property="og:description" content="Explore projects, skills, and experience of Dipesh Luitel – Python & Django Developer from Nepal.">
    <meta property="og:image" content="https://dipeshluitel.com.np/static/portfolio/images/portfolioDP.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://dipeshluitel.com.np/">
    <meta property="twitter:title" content="Dipesh Luitel | Python & Django Developer">
    <meta property="twitter:description" content="BSc. CSIT student & Python Developer building scalable web applications.">
    <meta property="twitter:image" content="https://dipeshluitel.com.np/static/portfolio/images/portfolioDP.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{%static 'portfolio/images/portfolioDP.png'%}">

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a">


    <title>{% block title %}Portfolio{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- AOS (Scroll Animation) -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quattrocento:wght@400;700&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&display=swap" rel="stylesheet">


</head>

<body>

    {% include 'portfolio/navbar.html' %}

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 900,
        easing: 'ease-in-out'});
    </script>
</body>

</html>
